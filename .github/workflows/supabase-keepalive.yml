# Evita que Supabase pause el proyecto free tier por 7 días sin actividad de BD
# (plan, riesgo #2). Llama a la RPC pública public.keepalive() — un SELECT 1 real,
# no una respuesta cacheada — con la anon key, que ya es pública por diseño.
#
# Setup necesario en GitHub (Settings → Secrets and variables → Actions):
#   SUPABASE_URL       — https://<project-ref>.supabase.co
#   SUPABASE_ANON_KEY  — la misma que EXPO_PUBLIC_SUPABASE_ANON_KEY en .env

name: Supabase keepalive

on:
  schedule:
    - cron: '0 6 * * 1' # cada lunes 06:00 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a public.keepalive()
        run: |
          status=$(curl -s -o /tmp/body -w '%{http_code}' \
            -X POST "${SUPABASE_URL}/rest/v1/rpc/keepalive" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json")
          cat /tmp/body
          if [ "$status" -ge 300 ]; then
            echo "keepalive falló con HTTP $status"
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
